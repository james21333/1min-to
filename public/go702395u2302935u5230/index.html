<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title></title>
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
  <meta name="googlebot" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
  <meta name="bingbot" content="noindex, nofollow, noarchive, nosnippet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Source+Serif+4:opsz,wght@8..60,500;8..60,700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f3f6f4;
      --bg-accent: #e4efe8;
      --ink: #14201a;
      --muted: #5c6b62;
      --line: #d5e0d9;
      --brand: #1f6b4a;
      --brand-deep: #0f3d2c;
      --brand-soft: #d8eee3;
      --surface: #ffffff;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: 1.25rem;
      font-family: Outfit, system-ui, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(900px 420px at 50% -10%, var(--bg-accent), transparent 60%),
        var(--bg);
      line-height: 1.45;
    }
    .wrap {
      width: min(100%, 420px);
      text-align: center;
    }
    .found-title {
      margin: 0 0 1rem;
      font-family: "Source Serif 4", Georgia, serif;
      font-size: clamp(2.4rem, 9vw, 3.25rem);
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 1.05;
      color: var(--brand-deep);
    }
    .card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 1.5rem 1.15rem 1.35rem;
    }
    .brand {
      margin: 0;
      font-family: "Source Serif 4", Georgia, serif;
      font-size: clamp(2.1rem, 8vw, 2.85rem);
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 1.05;
      color: var(--brand);
      word-break: break-word;
    }
    .offer {
      margin: 0.55rem 0 0;
      font-size: clamp(1.15rem, 4.5vw, 1.35rem);
      font-weight: 700;
      color: var(--ink);
    }
    .coupons {
      margin-top: 1.1rem;
      display: grid;
      gap: 0.6rem;
      text-align: left;
    }
    .coupon {
      border: 1.5px solid var(--line);
      background: var(--brand-soft);
      border-radius: 14px;
      padding: 0.85rem 0.95rem;
    }
    .coupon strong {
      display: block;
      color: var(--brand-deep);
      font-size: 1.1rem;
      letter-spacing: 0.03em;
      margin-bottom: 0.15rem;
    }
    .coupon span {
      color: var(--muted);
      font-size: 0.92rem;
    }
    .status {
      margin: 1.15rem 0 0;
      font-size: 0.95rem;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <main class="wrap">
    <h1 class="found-title">Match Found!</h1>
    <div class="card">
      <p class="brand">Enhance.MD</p>
      <p class="offer">Summer offer unlocked</p>
      <div class="coupons">
        <div class="coupon">
          <strong>SUMMER100</strong>
          <span>Get $100 off 3+ month plans</span>
        </div>
        <div class="coupon">
          <strong>SUMMER50</strong>
          <span>Get $50 off monthly plans</span>
        </div>
      </div>
      <p class="status">Taking you there now…</p>
    </div>
  </main>
  <script>
    setTimeout(function () {
      window.location.replace("https://cd-down.com/?a=78819&c=431090");
    }, 2000);
  </script>
</body>
</html>
